services:
  - type: web
    name: toon-benchmark-api
    runtime: python
    plan: free
    region: singapore   # Singapore
    rootDir: api
    buildCommand: pip install -r requirements.txt && pip install ./toon_cpp
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

  - type: web
    name: toon-benchmark-frontend
    runtime: python
    plan: free
    region: ohio   # US East -- real intercontinental distance from the api service (Singapore)
    rootDir: frontend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: API_BASE_URL
        value: https://toon-benchmark-api.onrender.com   # public URL -- private "host" property doesn't work cross-region, see README
