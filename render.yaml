services:
  - type: web
    name: toon-benchmark-api
    runtime: python
    plan: free
    region: singapore
    rootDir: api
    buildCommand: pip install -r requirements.txt && cd toon_cpp && python setup.py build_ext --inplace
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

  - type: web
    name: toon-benchmark-frontend
    runtime: python
    plan: free
    region: ohio
    rootDir: frontend
    buildCommand: pip install -r requirements.txt && cd toon_cpp && python setup.py build_ext --inplace
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: API_BASE_URL
        value: https://toon-benchmark-api.onrender.com